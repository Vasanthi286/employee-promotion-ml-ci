name: Practical 14 - Kubernetes CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "Dockerfile"
      - "requirements.txt"
      - "test_app.py"
      - "test_ml_pipeline.py"
      - ".github/workflows/practical14-kubernetes-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/vasanthi286/employee-promotion-ml-ci

jobs:
  build-test-push:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t employee-promotion:test .

      - name: Start and test container
        run: |
          docker run -d --name employee-promotion-test -p 5000:5000 employee-promotion:test
          for i in $(seq 1 30); do
            if curl --fail http://localhost:5000/; then
              echo "Application check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs employee-promotion-test
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        run: |
          docker tag employee-promotion:test "$IMAGE_NAME:${GITHUB_SHA}"
          docker tag employee-promotion:test "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

      - name: Clean up test container
        if: always()
        run: docker rm -f employee-promotion-test || true

  deploy:
    name: Deploy to Minikube
    needs: build-test-push
    runs-on: self-hosted

    steps:
      - name: Verify Kubernetes cluster
        shell: powershell
        run: |
          kubectl get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes cluster is unavailable"
          }

      - name: Load published image into Minikube
        shell: powershell
        run: |
          $image = "ghcr.io/vasanthi286/employee-promotion-ml-ci:${{ github.sha }}"
          docker pull $image
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to pull published image"
          }
          minikube image load $image
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to load image into Minikube"
          }

      - name: Update deployment image
        shell: powershell
        run: |
          $image = "ghcr.io/vasanthi286/employee-promotion-ml-ci:${{ github.sha }}"
          kubectl set image deployment/employee-promotion employee-promotion=$image
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update deployment"
          }

      - name: Wait for rollout
        id: rollout
        continue-on-error: true
        shell: powershell
        run: |
          kubectl rollout status deployment/employee-promotion --timeout=180s

      - name: Roll back on failure
        if: steps.rollout.outcome == 'failure'
        shell: powershell
        run: |
          kubectl rollout undo deployment/employee-promotion
          kubectl rollout status deployment/employee-promotion --timeout=180s
          throw "Deployment failed; rollback attempted"

      - name: Verify deployment
        if: steps.rollout.outcome == 'success'
        shell: powershell
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
          kubectl get endpoints employee-promotion
