name: Employee Promotion ML CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  train-test-containerize:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train employee promotion model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Build Docker image
        run: docker build -t employee-promotion-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name employee-promotion-ml-container \
            -p 5000:5000 \
            employee-promotion-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5001/health; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs employee-promotion-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Age": 30,
              "Department": "R&D",
              "Education_Level": "Bachelor'\''s",
              "Years_at_Company": 5,
              "Years_in_Current_Role": 2,
              "Job_Level": "Mid",
              "Performance_Score": 4,
              "Training_Hours": 20,
              "Projects_Completed": 5,
              "Certifications": 2,
              "Salary": 60000,
              "Job_Satisfaction": 4,
              "Work_Life_Balance": 4,
              "Manager_Rating": 4,
              "Overtime": "No",
              "Previous_Promotions": 1,
              "Absence_Days": 5,
              "Remote_Work": "Yes",
              "Monthly_Hours": 160
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs employee-promotion-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f employee-promotion-ml-container || true

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp employee_promotion_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Employee Promotion Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\nHealth: GET /health\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: employee-promotion-ml-release
          path: release_candidate/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
