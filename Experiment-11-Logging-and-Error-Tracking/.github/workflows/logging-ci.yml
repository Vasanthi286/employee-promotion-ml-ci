
name: Practical 11 - Logging CI

on:
  push:
    branches: [main]
    paths:
      - 'Experiment-11-Logging-and-Error-Tracking/**'
      - '.github/workflows/logging-ci.yml'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Experiment-11-Logging-and-Error-Tracking/requirements.txt

      - name: Run logging API tests
        working-directory: Experiment-11-Logging-and-Error-Tracking
        run: python -m unittest -v test_app.py

