
name: Employee Promotion Docker Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check required files
        run: |
          echo "Checking recovered-project directory"
          ls -la recovered-project
          test -f recovered-project/Dockerfile
          test -f recovered-project/app.py
          test -f recovered-project/requirements.txt
          test -f recovered-project/employee_promotion_model.pkl
          test -f recovered-project/metrics.json

      - name: Build Docker image
        run: |
          docker build \
            -f recovered-project/Dockerfile \
            -t employee-promotion-ml:ci \
            recovered-project

      - name: Run Docker container
        run: |
          docker run -d \
            --name employee-promotion-ci \
            -p 5001:5000 \
            employee-promotion-ml:ci

      - name: Test Docker image
        run: |
          for i in $(seq 1 15); do
            if curl --fail http://localhost:5001/; then
              echo "Application health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Application health check failed"
          docker logs employee-promotion-ci
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker tag employee-promotion-ml:ci \
            ghcr.io/${{ github.repository_owner }}/employee-promotion-ml:ci

      - name: Publish Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/employee-promotion-ml:ci

      - name: Clean up container
        if: always()
        run: |
          docker rm -f employee-promotion-ci || true
