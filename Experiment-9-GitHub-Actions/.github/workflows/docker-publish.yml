```yaml
name: Employee Promotion Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t employee-promotion-ml:ci \
            .

      - name: Test Docker image
        run: |
          docker run -d \
            --name employee-promotion-test \
            -p 5000:5000 \
            employee-promotion-ml:ci

          for i in {1..15}; do
            if curl -fsS http://localhost:5000/; then
              echo "Application health check passed"
              break
            fi

            if [ "$i" -eq 15 ]; then
              docker logs employee-promotion-test
              exit 1
            fi

            sleep 2
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag employee-promotion-ml:ci \
            ghcr.io/${{ github.repository_owner }}/employee-promotion-ml:exp9

      - name: Push Docker image to GHCR
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/employee-promotion-ml:exp9

      - name: Clean up test
