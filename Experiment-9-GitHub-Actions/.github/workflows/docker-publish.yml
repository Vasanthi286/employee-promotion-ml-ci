
name: Employee Promotion Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f recovered-project/Dockerfile
          test -f recovered-project/app.py
          test -f recovered-project/requirements.txt
          test -f recovered-project/employee_promotion_model.pkl
          test -f recovered-project/metrics.json
          echo "All required project files found."

      - name: Build Docker image
        run: |
          docker build \
            -f recovered-project/Dockerfile \
            -t employee-promotion-ml:ci \
            recovered-project

      - name: Test Docker image
        run: |
          docker run -d --name employee-promotion-test \
            -p 5000:5000 employee-promotion-ml:ci

          for i in {1..15}; do
            if curl --fail http://localhost:5000/; then
              echo "Homepage test passed."
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:5000/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Publish Docker image
        run: |
          docker tag employee-promotion-ml:ci "$IMAGE_NAME:exp9"
          docker push "$IMAGE_NAME:exp9"
