
name: Employee Promotion Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f Dockerfile
          test -f app.py
          test -f requirements.txt
          test -f Experiment-9-GitHub-Actions/employee_promotion_model.pkl
          test -f Experiment-9-GitHub-Actions/metrics.json

      - name: Prepare Docker build files
        run: |
          cp Experiment-9-GitHub-Actions/employee_promotion_model.pkl .
          cp Experiment-9-GitHub-Actions/metrics.json .

      - name: Build Docker image
        run: docker build -t employee-promotion-ml:ci .

      - name: Run container
        run: |
          docker run -d --name employee-promotion-test \
            -p 5000:5000 employee-promotion-ml:ci

      - name: Test homepage
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:5000/; then
              echo "Homepage test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs employee-promotion-test
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag employee-promotion-ml:ci "$IMAGE_NAME:exp9"
          docker push "$IMAGE_NAME:exp9"

      - name: Cleanup
        if: always()
        run: docker rm -f employee-promotion-test || true
