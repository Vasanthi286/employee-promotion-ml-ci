```yaml
name: Employee Promotion Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t employee-promotion-ml:ci .

      - name: Run Docker container
        run: |
          docker run -d --name employee-promotion-test \
            -p 5000:5000 employee-promotion-ml:ci

      - name: Test application
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs employee-promotion-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f employee-promotion-test || true
```

