
name: Employee Promotion Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          ls -la recovered-project
          test -f recovered-project/Dockerfile
          test -f recovered-project/app.py
          test -f recovered-project/requirements.txt
          test -f recovered-project/employee_promotion_model.pkl
          test -f recovered-project/metrics.json
          echo "All required files found."

      - name: Build Docker image
        run: |
          docker build \
            -f recovered-project/Dockerfile \
            -t employee-promotion-ml:ci \
            recovered-project

      - name: Run container
        run: |
          docker run -d \
            --name employee-promotion-test \
            -p 5000:5000 \
            employee-promotion-ml:ci

      - name: Test homepage
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:5000/; then
              echo "Homepage test passed."
              exit 0
            fi
            sleep 2
          done

          docker logs employee-promotion-test
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Tag Docker image
        run: |
          docker tag employee-promotion-ml:ci "$IMAGE_NAME:exp9"
          docker tag employee-promotion-ml:ci "$IMAGE_NAME:latest"

      - name: Push image to GHCR
        run: |
          docker push "$IMAGE_NAME:exp9"
          docker push "$IMAGE_NAME:latest"

      - name: Clean up test container
        if: always()
        run: docker rm -f employee-promotion-test || true
